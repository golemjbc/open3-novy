          <li><a href="https://discord.gg/qYCAubmDQc">Discord</a></li>

  <script src="assets/js/auth.js"></script>
  <script src="assets/js/profile-modal.js"></script>
  <script>
    // Po přihlášení přes hlavičku (na téhle stránce často z access-denied stavu, kdy
    // stránka ještě nezná roli/typ přihlášení) se musí celá stránka znovu vyhodnotit -
    // stejný vzorec jako akce.html, jinak zůstane viset na starém stavu bez obnovení.
    window.onOooLogin = () => location.reload();

    const params = new URLSearchParams(window.location.search);
    const eventId = params.get('event_id');
    const pageBody = document.getElementById('page-body');

    // Zaplněnost akce (2026-08-25) - viz stejná funkce v akce.html pro kontext; `obsazenost`
    // přichází hotová z backendu (fráze + vizuální %), tady se jen vykreslí.
    function renderOccupancy(obsazenost) {
      if (!obsazenost) return '';
      return `
        <div class="occupancy">
          <div class="occupancy-track"><div class="occupancy-fill" style="width:${obsazenost.fill}%"></div></div>
          <div class="occupancy-text">Obsazenost: ${obsazenost.text}</div>
        </div>`;
    }

    function getSmartImageUrl(url) {
      if (!url) return null;
      const driveMatch = url.match(/\/d\/([a-zA-Z0-9-_]+)/);
      if (driveMatch) return `https://drive.google.com/thumbnail?id=${driveMatch[1]}&sz=w800`;
      if (url.includes('photos.app.goo.gl') || url.includes('photos.google.com')) {
        return 'https://images.weserv.nl/?url=' + encodeURIComponent(url);
      }
      return url;
    }
    function formatDateRange(fromStr, toStr) {
      fromStr = (fromStr || '').trim();
      toStr = (toStr || '').trim();
      if (!fromStr && !toStr) return '';
      if (!fromStr) return toStr;
      if (!toStr) return fromStr;
      const parse = (s) => {
        const parts = s.split('.').map(p => p.trim()).filter(Boolean);
        return parts.length >= 3 ? { day: parts[0], month: parts[1], year: parts[2] } : null;
      };
      const from = parse(fromStr);
      const to = parse(toStr);
      if (!from || !to) return `${fromStr} – ${toStr}`;
      if (from.year === to.year && from.month === to.month) {
        return `${from.day}.–${to.day}.${to.month}.${to.year}`;
      }
      if (from.year === to.year) {
        return `${from.day}.${from.month}. – ${to.day}.${to.month}.${to.year}`;
      }
      return `${fromStr} – ${toStr}`;
    }
    function parseImageUrls(cellValue) {
      if (!cellValue) return [];
      return cellValue.split(';').map(u => u.trim()).filter(Boolean);
    }
    function userHasRequiredRole(requiredRolesString, userRolesObj) {
      const trimmed = (requiredRolesString || '').trim();
      if (!trimmed) return true;
      const requiredList = trimmed.split(',').map(r => r.trim()).filter(Boolean);
      if (requiredList.length === 0) return true;
      return requiredList.some(roleName => userRolesObj.hasOwnProperty(roleName));
    }

    if (!eventId) {
      pageBody.innerHTML = '<div class="empty-state">Akce nenalezena (chybí event_id v URL).</div>';
    } else {
      Promise.all([
        fetch(API_BASE + '/api/events').then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); }),
        fetch(API_BASE + '/api/members').then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      ]).then(([events, members]) => {
        const event = events.find(ev => ev.event_id === eventId);
        if (!event) {
          pageBody.innerHTML = '<div class="empty-state">Akce s ID ' + eventId + ' nebyla nalezena.</div>';
          return;
        }

        // 🔒 Kontrola oprávnění - stejná logika jako na produkci (přihlášení + discord_role_required)
        const loggedUser = getLoggedUser();
        const isLoggedIn = !!loggedUser && !!loggedUser.userId;
        let myRoles = {};
        if (isLoggedIn) {
          const me = members.find(m => m.user_id === loggedUser.userId);
          myRoles = (me && me.roles) || {};
        }
        const requiredRoles = event.discord_role_required || '';
        const isPublicEvent = event.typ_akce === 'A';
        // Typ B (Google) i typ C (Google i Discord, 2026-08-24) - stejná výjimka jako v
        // akce.html, viz komentář tam. Bez role musí na detail vůbec vidět, jinak se
        // nikdy nedostane k registraci/formuláři, co ho k roli teprve navede.
        const canBypassRoleCheck = (event.typ_akce === 'B' && isGoogleUser(loggedUser)) || event.typ_akce === 'C';
        const hasAccess = isLoggedIn && (isPublicEvent || canBypassRoleCheck || userHasRequiredRole(requiredRoles, myRoles));

        if (!hasAccess) {
          pageBody.innerHTML = `
            <div class="access-denied">
              <h2>Přístup odepřen</h2>
              <p>${isLoggedIn
                ? 'Na tuto akci nemáš potřebné oprávnění (' + (requiredRoles || '—') + ').'
                : 'Pro zobrazení a přihlášení na tuto akci se nejdřív musíš přihlásit.'}</p>
              <a href="akce.html" class="btn btn-primary">← Zpět na seznam akcí</a>
            </div>`;
          return;
        }

        renderEventDetail(event, members);
      }).catch(err => {
        console.error(err);
        pageBody.innerHTML = '<div class="empty-state">Chyba při načítání detailu akce.</div>';
      });
    }

    function renderEventDetail(event, members) {
      const isFreeEvent = !event.cena || event.cena.trim() === '' || parseFloat(event.cena) === 0;
      const images = parseImageUrls(event.obrazky || event.obrazek || '').map(getSmartImageUrl);
      const prefs = [event.pref_A, event.pref_B, event.pref_C, event.pref_D, event.pref_E].filter(Boolean);

      let discordLinkHtml = '';
      if (event.discord_info) {
        const urlMatch = event.discord_info.match(/https?:\/\/[^\s\[\]]+/);
        if (urlMatch) discordLinkHtml = `<p class="discord-link-inline">💬 <a href="${urlMatch[0]}" target="_blank">Diskuze a dotazy na Discordu</a></p>`;
      }

      // Ochutnávka popisu = text do prvního <br> (přirozený úvodní odstavec),
      // jen když popis nemá žádný <br> vůbec, padneme na bezpečné oříznutí délky
      const brMatch = (event.popis || '').match(/<br\s*\/?>/i);
      let leadText;
      if (brMatch) {
        leadText = event.popis.slice(0, brMatch.index).replace(/<[^>]+>/g, '').trim();
      } else {
        const plain = (event.popis || '').replace(/<[^>]+>/g, '').trim();
        leadText = plain.length > 220 ? plain.slice(0, 220).trim() + '…' : plain;
      }
      const leadHtml = leadText
        ? `<p class="lead-teaser">${leadText} <a href="#popis" class="read-more-link">Číst dál ↓</a></p>`
        : '';

      const galleryHtml = images.length
        ? images.map(src => `<img src="${src}" alt="${event.nazev || ''}">`).join('')
        : `<img src="assets/images/OOOlogo.png" alt="${event.nazev || ''}">`;
      const dotsHtml = images.length > 1
        ? images.map((_, i) => `<span class="${i === 0 ? 'active' : ''}"></span>`).join('')
        : '';
      const arrowsHtml = images.length > 1
        ? `<button type="button" class="gallery-arrow gallery-arrow-prev" id="gallery-prev" aria-label="Předchozí obrázek">‹</button>
           <button type="button" class="gallery-arrow gallery-arrow-next" id="gallery-next" aria-label="Další obrázek">›</button>`
        : '';

      const prefsHtml = prefs.length
        ? prefs.map((p, i) => `<label><input type="checkbox" name="pref" value="${p.replace(/"/g, '&quot;')}"> ${p}</label>`).join('')
        : '<p class="form-hint">Pro tuto akci nejsou definované žádné preference.</p>';

      pageBody.innerHTML = `
        <div class="detail-grid">
          <div>
            <div class="gallery">
              <div class="gallery-viewport">
                <div class="gallery-main" id="gallery-main">${galleryHtml}</div>
                ${arrowsHtml}
              </div>
              <div class="gallery-dots" id="gallery-dots">${dotsHtml}</div>
            </div>
          </div>
          <div>
            <div class="detail-card">
              <h1>${event.nazev || ''}</h1>

              <div class="date-strip">
                <div class="date-strip-main">${formatDateRange(event['datum od'], event.datum_do)}</div>
                <div class="date-strip-sub">${event['místo'] || '—'}</div>
                <div class="date-strip-sub">Registrace do ${event.registrace_konec || 'bude upřesněno'}</div>
              </div>

              ${renderOccupancy(event.obsazenost)}

              <div class="price-tag">${event.cena ? event.cena + ' Kč' : 'Cena bude upřesněna'}</div>

              ${leadHtml}
              ${discordLinkHtml}

              ${(() => {
                const currentUser = getLoggedUser();
                // provider === 'google' pozná novou, čerstvou přihlašovací session. Fallback
                // na tvar userId (Google appka ho vždycky skládá jako "google_<id>") je pro
                // starší/uloženou session z localStorage, co v sobě ještě provider nemá
                // (vznikla dřív, než auth.js začal provider ukládat) - bez tohohle fallbacku
                // se takový člověk tiše přesměruje na starou Discord přihlášku (viz krok 22,
                // 2026-08-23 - přesně tenhle případ nastal a přihláška šla špatnou cestou).
                const isGoogleUser = window.isGoogleUser(currentUser);
                const isPublicEvent = event.typ_akce === 'A';
                // Typ B (jen role na Discordu) i typ C (dotazník + schválení patronem,
                // Fáze 5, 2026-08-24) přes Google umí endpoint - formulář se zobrazí
                // stejně jako u A, jen po odeslání (nebo návratu na stránku) může přijít
                // needs_discord_role/needs_questionnaire/needs_patron_approval místo
                // platby, viz submit handler a checkAlreadyRegistered níž.
                const isSupportedByGoogle = isPublicEvent || event.typ_akce === 'B' || event.typ_akce === 'C';

                // Discord uživatel bez role na typ C (2026-08-24, na výslovnou žádost -
                // "chovat se logicky podobně jako Google"): dřív tu byla mezera - hasAccess
                // nahoře ho pustí dál (viz canBypassRoleCheck), ale bez tohohle by spadl do
                // nativního Discord formuláře (register-event), co dotazníkový flow vůbec
                // nezná. Použije stejný "univerzální" formulář jako Google, jen s Discord
                // identitou místo credential - viz identityPayload() v submit handleru.
                const isDiscordUser = !!currentUser && !isGoogleUser;
                let hasRoleForCurrentUser = true;
                if (isDiscordUser && event.typ_akce === 'C') {
                  const me = members.find(m => m.user_id === currentUser.userId);
                  const myRolesHere = (me && me.roles) || {};
                  hasRoleForCurrentUser = userHasRequiredRole(event.discord_role_required || '', myRolesHere);
                }
                const usesUnifiedForm = (isGoogleUser && isSupportedByGoogle) || (isDiscordUser && event.typ_akce === 'C' && !hasRoleForCurrentUser);

                if (isGoogleUser && !isSupportedByGoogle) {
                  return `
                    <div id="registration-block" class="status-panel info">
                      <h4 style="margin-top:0;">Tahle akce vyžaduje Discord</h4>
                      <p style="margin-bottom:0;">Akce tohoto typu vyžaduje roli na Discordu. Přihlášení přes Google zatím funguje jen pro veřejné a členské akce — registrace na tenhle typ akce přes Google se připravuje.</p>
                    </div>`;
                }

                if (usesUnifiedForm) {
                  return `
                    <div id="registration-block">
                      <h3>Přihláška na akci</h3>
                      <form id="registration-form-google">
                        <div class="form-group">
                          <label class="form-label">Typ účasti</label>
                          <div class="pill-choice">
                            <input type="radio" name="typUcastiG" id="typSingleG" value="single" checked>
                            <label for="typSingleG">Single</label>
                            <input type="radio" name="typUcastiG" id="typParG" value="par">
                            <label for="typParG">Pár</label>
                          </div>
                        </div>
                        <div class="form-group">
                          <label class="form-label">Preference</label>
                          <div class="pref-list">${prefsHtml}</div>
                        </div>
                        <div class="form-group">
                          <label class="form-label" for="telefonG">Telefon (nepovinné)</label>
                          <input type="tel" class="form-control" id="telefonG" placeholder="+420 123 456 789" value="+420 " inputmode="tel">
                        </div>
                        <div class="form-group">
                          <label class="form-label" for="instagramG">Instagram (nepovinné)</label>
                          <input type="text" class="form-control" id="instagramG" placeholder="@tvůj_účet">
                        </div>
                        <div class="form-group">
                          <label style="display:flex; gap:8px; align-items:flex-start; font-size:0.9rem;">
                            <input type="checkbox" id="confirm18" required style="margin-top:3px;">
                            <span>Potvrzuji, že mi je 18 let.</span>
                          </label>
                        </div>
                        <div class="form-group">
                          <label style="display:flex; gap:8px; align-items:flex-start; font-size:0.9rem;">
                            <input type="checkbox" id="confirmRules" required style="margin-top:3px;">
                            <span>Souhlasím s <a href="pravidla.html" target="_blank">pravidly komunity a zpracováním osobních údajů (GDPR)</a>.</span>
                          </label>
                        </div>
                        <button type="submit" class="btn btn-primary btn-block" id="submitGoogleReg" disabled>Přihlásit se na akci</button>
                      </form>
                    </div>`;
                }

                return `
              <div id="registration-block">
                <h3>Přihláška na akci</h3>
                <form id="registration-form">
                  <div class="form-group">
                    <label class="form-label">Typ účasti</label>
                    <div class="pill-choice">
                      <input type="radio" name="typUcasti" id="typSingle" value="single" checked>
                      <label for="typSingle">Single</label>
                      <input type="radio" name="typUcasti" id="typPar" value="par">
                      <label for="typPar">Pár</label>
                    </div>
                  </div>
                  <div class="form-group hidden" id="partner-group">
                    <label class="form-label" for="partnerDiscord">Discord jméno partnera (pokud má)</label>
                    <div class="autocomplete-wrap">
                      <input type="text" class="form-control" id="partnerDiscord" placeholder="Začni psát Discord jméno…">
                      <div class="autocomplete-dropdown" id="partner-dropdown"></div>
                    </div>
                    <div class="form-hint">Vyber z nabídky nebo napiš ručně (bez Discordu OK).</div>
                  </div>
                  <div class="form-group">
                    <label class="form-label">Preference</label>
                    <div class="pref-list">${prefsHtml}</div>
                  </div>
                  <button type="submit" class="btn btn-primary btn-block">Přihlásit se na akci</button>
                </form>
              </div>`;
              })()}

              <div id="registration-info" class="status-panel success hidden"></div>
              <div id="deposit-info" class="status-panel info hidden"></div>
              <div id="final-payment-info" class="status-panel info hidden"></div>
              <div id="payment-complete" class="status-panel success hidden"></div>
            </div>
          </div>
        </div>

        ${event.popis ? `
        <div class="event-description" id="popis">
          <h2>O akci</h2>
          <div class="prose">${event.popis}</div>
        </div>` : ''}
      `;

      // Galerie: scroll -> tečky, klikatelné tečky, šipky
      const galleryMain = document.getElementById('gallery-main');
      const dots = document.querySelectorAll('#gallery-dots span');
      const galleryPrev = document.getElementById('gallery-prev');
      const galleryNext = document.getElementById('gallery-next');

      let galleryIndex = 0;
      function goToSlide(i) {
        galleryIndex = Math.max(0, Math.min(images.length - 1, i));
        // Přímé nastavení + CSS scroll-behavior:smooth (spolehlivější než scrollTo({behavior:'smooth'}))
        galleryMain.scrollLeft = galleryIndex * galleryMain.clientWidth;
        dots.forEach((d, idx) => d.classList.toggle('active', idx === galleryIndex));
      }

      if (galleryMain && dots.length) {
        galleryMain.addEventListener('scroll', () => {
          galleryIndex = Math.round(galleryMain.scrollLeft / galleryMain.clientWidth);
          dots.forEach((d, i) => d.classList.toggle('active', i === galleryIndex));
        });
        dots.forEach((dot, i) => dot.addEventListener('click', () => goToSlide(i)));
      }
      if (galleryPrev) galleryPrev.addEventListener('click', () => goToSlide(galleryIndex - 1));
      if (galleryNext) galleryNext.addEventListener('click', () => goToSlide(galleryIndex + 1));

      const partnerGroup = document.getElementById('partner-group');
      const typSingleEl = document.getElementById('typSingle');
      const typParEl = document.getElementById('typPar');
      if (typSingleEl) typSingleEl.addEventListener('change', function () { if (this.checked) partnerGroup.classList.add('hidden'); });
      if (typParEl) typParEl.addEventListener('change', function () { if (this.checked) partnerGroup.classList.remove('hidden'); });

      // Partner autocomplete (stejná logika jako produkce, jen nový markup)
      let discordMembers = members.map(m => {
        const displayName = m.roles['Zobrazované jméno'] || m.roles['Uživatelské jméno'] || 'Neznámý';
        const username = m.roles['Uživatelské jméno'] || 'Neznámý';
        return { userId: m.user_id, displayName, username };
      });
      const partnerInput = document.getElementById('partnerDiscord');
      const dropdown = document.getElementById('partner-dropdown');
      if (partnerInput) {
        partnerInput.addEventListener('input', function () {
          const q = this.value.toLowerCase();
          if (q.length < 2) { dropdown.style.display = 'none'; return; }
          const matches = discordMembers.filter(m =>
            m.userId.toLowerCase().includes(q) || m.displayName.toLowerCase().includes(q) || m.username.toLowerCase().includes(q)
          ).slice(0, 8);
          dropdown.innerHTML = matches.map(m =>
            `<div class="autocomplete-item" data-user-id="${m.userId}" data-display-name="${m.displayName}" data-username="${m.username}">
               <strong>${m.displayName}</strong><small>${m.username}</small>
             </div>`
          ).join('');
          dropdown.style.display = matches.length ? 'block' : 'none';
        });
        dropdown.addEventListener('click', function (e) {
          const item = e.target.closest('.autocomplete-item');
          if (!item) return;
          partnerInput.value = `${item.dataset.displayName} | ${item.dataset.username} | ${item.dataset.userId}`;
          dropdown.style.display = 'none';
        });
        document.addEventListener('click', function (e) {
          if (!e.target.closest('#partnerDiscord')) dropdown.style.display = 'none';
        });
      }

      function showPanel(id, html) {
        const el = document.getElementById(id);
        el.innerHTML = html;
        el.classList.remove('hidden');
      }
      function hidePanel(id) { document.getElementById(id).classList.add('hidden'); }

      // Typ B (2026-08-24): dokud chybí role na Discordu, platba se vůbec nezobrazuje -
      // stejná informace jako v e-mailu (needs_discord_role z register-event-google /
      // my-registrations). DŮLEŽITÉ (oprava 2026-08-24, nalezeno živým testem): tlačítko
      // MUSÍ vést na stejný discord_cta_url, co dostal e-mail (OAuth párování nebo přímý
      // odkaz na server) - ne na obecnou veřejnou pozvánku. Obecná pozvánka jen připojí na
      // server bez jakéhokoli párování s ooo_id, takže registrace zůstane navěky viset na
      // "chybí role" i po připojení - přesně tohle se živě stalo. discord_cta_url může
      // chybět jen ve výjimečném selhání (chybějící pairingCode) - pak fallback na
      // obecnou pozvánku, lepší než úplně bez tlačítka.
      function showNeedsDiscordRolePanel(ctaUrl) {
        document.getElementById('registration-block').classList.add('hidden');
        const url = ctaUrl || 'https://discord.gg/qYCAubmDQc';
        showPanel('registration-info', `
          <h4 style="margin-top:0;">Ještě jeden krok</h4>
          <p>Tvoje přihláška je přijatá. Tahle akce vyžaduje roli na Discordu (dokončit uvítací proces/pravidla serveru) — poslali jsme ti e-mail se stejným tlačítkem. Jakmile roli dostaneš, stránka se sama obnoví (bot roli synchronizuje do pár minut).</p>
          <a href="${url}" target="_blank" class="btn btn-primary">Propojit a otevřít Discord</a>
        `);
        startWaitingStatePoll();
      }

      // Typ C (Fáze 5, 2026-08-24): dva další "čekej" stavy vedle needs_discord_role -
      // dotazník nevyplněný (odkaz na dotaznik.html) a dotazník vyplněný, čeká se na
      // patrona (nic se nedá udělat, jen čekat, stejné auto-obnovení jako u role).
      function showNeedsQuestionnairePanel(url) {
        document.getElementById('registration-block').classList.add('hidden');
        showPanel('registration-info', `
          <h4 style="margin-top:0;">Ještě jeden krok</h4>
          <p>Tvoje přihláška je přijatá. Tahle akce je pro ověřené členy komunity — prvním krokem je vyplnit krátký vstupní dotazník.</p>
          <a href="${url}" class="btn btn-primary">Vyplnit dotazník</a>
        `);
        startWaitingStatePoll();
      }
      function showNeedsPatronApprovalPanel() {
        document.getElementById('registration-block').classList.add('hidden');
        showPanel('registration-info', `
          <h4 style="margin-top:0;">Čeká tě schůzka s patronem</h4>
          <p>Dotazník máme, patron si ho prohlédne a ozve se ti, abyste si domluvili osobní nebo online popovídání. Stránka se sama obnoví, jakmile bude vše hotové. Nic teď dělat nemusíš.</p>
        `);
        startWaitingStatePoll();
      }

      // Automatické obnovení stránky, jakmile se vyřeší poslední čekající krok
      // (needs_discord_role / needs_questionnaire / needs_patron_approval, 2026-08-24,
      // na žádost po živém testu - "stránka by se měla sama po napárování
      // aktualizovat"). Bot synchronizuje roli z Discordu do Sheetu ve 1minutovém
      // cyklu, takže se čeká - polling po 10s je dost časté na to, aby to nepůsobilo
      // rozbitě, a dost řídké, aby to nezatěžovalo API. Zastaví se samo po ~10 minutách
      // (60 pokusů), ať nezůstane běžet do nekonečna, když člověk kartu jen nechá
      // otevřenou.
      let discordRolePollTimer = null;
      let discordRolePollAttempts = 0;
      function startWaitingStatePoll() {
        if (discordRolePollTimer) return;
        const credential = (getLoggedUser() || {}).credential;
        if (!credential) return;
        discordRolePollAttempts = 0;
        discordRolePollTimer = setInterval(() => {
          discordRolePollAttempts++;
          if (discordRolePollAttempts > 60) { clearInterval(discordRolePollTimer); return; }
          fetch(API_BASE + '/api/my-registrations', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ credential, eventId: event.event_id }),
          })
            .then(r => r.json())
            .then(data => {
              const list = Array.isArray(data) ? data : (data && data.registrations) || [];
              const found = list.find(item => item.event_id === event.event_id);
              if (found && !found.needs_discord_role && !found.needs_questionnaire && !found.needs_patron_approval) {
                clearInterval(discordRolePollTimer);
                location.reload();
              }
            })
            .catch(err => console.error('Discord role poll error:', err));
        }, 10000);
      }

      function loadPaymentInfo(userId, userName, typUcasti, paymentType, idParam) {
        if (!userId) return;
        const qp = new URLSearchParams({
          event_id: event.event_id, [idParam || 'user_id']: userId, user_name: userName || '',
          typ_ucasti: typUcasti || 'single', payment_type: paymentType || 'deposit',
          jednorazova: event.jednorazova || 'ne'
        });
        fetch(API_BASE + '/api/get-deposit-info?' + qp.toString())
          .then(r => r.json())
          .then(data => {
            if (!data || !data.deposit_amount || data.deposit_amount === '0') return;
            const isFinal = paymentType === 'final';
            const targetId = isFinal ? 'final-payment-info' : 'deposit-info';
            const label = isFinal ? 'Doplatek' : 'Záloha';
            const amount = parseFloat(data.deposit_amount);
            const isPar = typUcasti === 'par';
            const amountText = isPar ? `2 × ${(amount / 2).toFixed(0)} Kč = ${amount} Kč` : `${amount} Kč`;
            showPanel(targetId, `
              <h4>${label}</h4>
              <p style="margin:0 0 4px;color:var(--text);font-weight:700;">${amountText}</p>
              <div class="qr-wrap">
                <img src="data:image/png;base64,${data.qr_base64}" alt="QR platba">
                <div class="qr-info">
                  <div><strong>Účet:</strong> ${data.account_cz || data.iban}</div>
                  <div><strong>VS:</strong> ${data.vs}</div>
                  <div><strong>Zpráva:</strong> ${data.message}</div>
                </div>
              </div>
            `);
          })
          .catch(err => console.error('Payment info error:', err));
      }

      function parsePrihlaskaRow(row) {
        if (!row) return {};
        return {
          deposit_status: row.deposit_status || '',
          doplatek: row.doplatek || '0',
          doplatek_status: row.doplatek_status || '',
          typ_ucasti: row.partner || 'single' // API vrací typ účasti pod polem "partner"
        };
      }

      // Sdílené vyhodnocení "už je přihlášen/á" - stejná logika pro Discord i Google cestu,
      // liší se jen tím, podle čeho se řádek v Prihlasky hledá (user_id vs ooo_id).
      function renderRegistrationStatus(found, id, userName, idParam) {
        if (found && found.needs_discord_role) {
          showNeedsDiscordRolePanel(found.discord_cta_url);
          return;
        }
        if (found && found.needs_questionnaire) {
          showNeedsQuestionnairePanel(found.questionnaire_url);
          return;
        }
        if (found && found.needs_patron_approval) {
          showNeedsPatronApprovalPanel();
          return;
        }
        const p = parsePrihlaskaRow(found);
        const depositOK = p.deposit_status?.toUpperCase() === 'OK';
        const doplatekOK = p.doplatek_status?.toUpperCase() === 'OK';

        document.getElementById('registration-block').classList.add('hidden');

        if (isFreeEvent) {
          showPanel('registration-info', '<strong>🎉 Jsi přihlášený na akci zdarma!</strong>');
          return;
        }
        if (doplatekOK || (isFreeEvent === false && event.jednorazova === 'ano' && depositOK) || (depositOK && doplatekOK)) {
          showPanel('payment-complete', '<h4>Akce zaplacena ✅</h4><p style="margin:0;">Máš všechny platby v pořádku. Uvidíme se na akci!</p>');
          return;
        }
        if (event.jednorazova !== 'ano' && depositOK && !doplatekOK) {
          showPanel('registration-info', '<strong>✅ Záloha zaplacena!</strong> Doplatek: ' + (p.doplatek || 'bude upřesněno'));
          loadPaymentInfo(id, userName, p.typ_ucasti, 'final', idParam);
          return;
        }
        const paymentType = (event.jednorazova === 'ano') ? 'final' : 'deposit';
        showPanel('registration-info', '<strong>Jsi přihlášen!</strong> Tvá přihláška byla úspěšně zaregistrována.');
        loadPaymentInfo(id, userName, p.typ_ucasti, paymentType, idParam);
      }

      (function checkAlreadyRegistered() {
        const storedUserJson = localStorage.getItem('oooUser');
        if (!storedUserJson) return;
        let userId, userName, provider;
        try {
          const u = JSON.parse(storedUserJson);
          userId = u.userId; userName = u.userName; provider = u.provider;
        } catch (e) { return; }
        if (!userId) return;
        // Google účty se ověřují výhradně přes credential blok níž (čerstvé, server-side
        // ověřené) - tahle stará (Discord) kontrola posílala syrové userId z localStorage
        // rovnou jako user_id, což u Google účtu mate dvě různé věci ("google_<sub>" není
        // Discord ID) a u staré/zbylé session mohlo najít cizí/neplatnou registraci, co s
        // aktuálním přihlášením nesouvisí (nahlásila uživatelka 2026-08-23).
        if (isGoogleUser({ provider, userId })) return;

        fetch(API_BASE + '/api/my-registrations?user_id=' + encodeURIComponent(userId))
          .then(r => r.json())
          .then(list => {
            if (!Array.isArray(list)) return;
            const found = list.find(item => item.event_id === event.event_id);
            if (!found) return;
            renderRegistrationStatus(found, userId, userName, 'user_id');
          })
          .catch(err => console.error('my-registrations error:', err));
      })();

      // --- Registrace přes Google (jen veřejné akce typ A) ---
      // Použije se rovnou token z aktuálního přihlášení (localStorage) - žádné druhé
      // přihlašování před odesláním přihlášky. Server si ho i tak vždy ověří (podpis +
      // platnost + komu byl vydaný), takže se nedá podvrhnout - jen se needěje žádost
      // o čerstvý token navíc. Jediné, co se může stát, je že token je po delší době
      // neplatný (Google tokeny mají platnost cca hodinu) - v tom případě požádáme
      // o nové přihlášení přes hlavičku.
      const googleForm = document.getElementById('registration-form-google');
      if (googleForm) {
        const confirm18 = document.getElementById('confirm18');
        const confirmRules = document.getElementById('confirmRules');
        const submitBtn = document.getElementById('submitGoogleReg');
        // Tenhle formulář teď slouží i Discord uživatelům bez role na typ C (2026-08-24,
        // na výslovnou žádost) - identita se pozná podle provider a posílá se pod
        // odpovídajícím jménem pole (my-registrations čeká `user_id`, register-event-
        // google čeká `discord_user_id` - dva různé, staré/nové konvence, nesjednocovat
        // silou na jednu, ať se to nesplete).
        const loggedUserForForm = getLoggedUser();
        const isGoogleUserForForm = isGoogleUser(loggedUserForForm);
        const storedCredential = isGoogleUserForForm ? (loggedUserForForm.credential || null) : null;
        const discordUserIdForForm = (loggedUserForForm && !isGoogleUserForForm) ? loggedUserForForm.userId : null;
        const hasIdentityForForm = !!(storedCredential || discordUserIdForForm);

        function updateGoogleSubmitState() {
          submitBtn.disabled = !(confirm18.checked && confirmRules.checked);
        }
        confirm18.addEventListener('change', updateGoogleSubmitState);
        confirmRules.addEventListener('change', updateGoogleSubmitState);
        updateGoogleSubmitState();

        // Telefon: předvyplněná +420 předvolba, číslice se za psaní samy seskupují po
        // trojicích (+420 123 456 789) - všichni v komunitě mají české číslo.
        const telefonInput = document.getElementById('telefonG');
        telefonInput.addEventListener('input', function () {
          let digits = this.value.replace(/^\+420/, '').replace(/\D/g, '').slice(0, 9);
          const groups = digits.match(/.{1,3}/g) || [];
          this.value = '+420' + (groups.length ? ' ' + groups.join(' ') : ' ');
        });
        telefonInput.addEventListener('focus', function () {
          if (this.value.length >= this.value.indexOf('+420 ') + 5) {
            this.setSelectionRange(this.value.length, this.value.length);
          }
        });

        if (hasIdentityForForm) {
          fetch(API_BASE + '/api/my-registrations', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              ...(storedCredential ? { credential: storedCredential } : { user_id: discordUserIdForForm }),
              eventId: event.event_id,
            }),
          })
            .then(r => r.json())
            .then(data => {
              const profile = data && data.profile;
              const list = Array.isArray(data) ? data : (data && data.registrations) || [];

              // Telefon/instagram: pokud je má člověk už v profilu, znovu se na ně
              // neptáme - pole se předvyplní a skryjí.
              if (profile) {
                if (profile.telefon) {
                  const g = document.getElementById('telefonG').closest('.form-group');
                  document.getElementById('telefonG').value = profile.telefon;
                  if (g) g.classList.add('hidden');
                }
                if (profile.instagram) {
                  const g = document.getElementById('instagramG').closest('.form-group');
                  document.getElementById('instagramG').value = profile.instagram;
                  if (g) g.classList.add('hidden');
                }
              }

              if (!list.length) return;
              renderRegistrationStatus(list[0], list[0].ooo_id, (profile && (profile.google_name || profile.google_email)) || '', 'ooo_id');
            })
            .catch(err => console.error('Google/Discord my-registrations error:', err));
        }

        googleForm.addEventListener('submit', function (e) {
          e.preventDefault();
          if (!hasIdentityForForm) {
            alert('Přihlášení už vypršelo, přihlas se prosím znovu přes tlačítko v hlavičce.');
            return;
          }
          const typUcastiG = document.querySelector('input[name="typUcastiG"]:checked').value;
          const selectedPrefs = Array.from(googleForm.querySelectorAll('input[name="pref"]:checked')).map(cb => cb.value);
          const telefonRaw = document.getElementById('telefonG').value.trim();
          const telefonVal = /\d/.test(telefonRaw) ? telefonRaw : ''; // "+420" bez číslic = nevyplněno
          const instagramVal = document.getElementById('instagramG').value.trim();

          submitBtn.disabled = true;
          submitBtn.textContent = 'Odesílám…';

          fetch(API_BASE + '/api/register-event-google', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              ...(storedCredential ? { credential: storedCredential } : { discord_user_id: discordUserIdForForm }),
              event_id: event.event_id,
              typ_ucasti: typUcastiG, preference: selectedPrefs,
              telefon: telefonVal, instagram: instagramVal,
            }),
          })
            .then(r => r.json())
            .then(data => {
              if (!data.ok) {
                const msg = /neplatný google token/i.test(data.error || '')
                  ? 'Přihlášení vypršelo, přihlas se prosím znovu přes hlavičku a zkus to znovu.'
                  : 'Chyba při registraci: ' + (data.error || 'neznámá chyba');
                alert(msg);
                submitBtn.disabled = false;
                updateGoogleSubmitState();
                return;
              }
              if (data.already_registered) {
                renderRegistrationStatus({
                  event_id: event.event_id, ooo_id: data.ooo_id,
                  deposit_status: data.deposit_status, doplatek_status: data.doplatek_status,
                  doplatek: data.deposit_amount, partner: typUcastiG,
                  needs_discord_role: data.needs_discord_role,
                  discord_cta_url: data.discord_cta_url,
                  needs_questionnaire: data.needs_questionnaire,
                  questionnaire_url: data.questionnaire_url,
                  needs_patron_approval: data.needs_patron_approval,
                }, data.ooo_id, data.name || data.email || '', 'ooo_id');
                return;
              }
              if (data.needs_discord_role) {
                showNeedsDiscordRolePanel(data.discord_cta_url);
                return;
              }
              if (data.needs_questionnaire) {
                showNeedsQuestionnairePanel(data.questionnaire_url);
                return;
              }
              if (data.needs_patron_approval) {
                showNeedsPatronApprovalPanel();
                return;
              }
              document.getElementById('registration-block').classList.add('hidden');
              showPanel('registration-info', isFreeEvent
                ? '<strong>🎉 Jsi přihlášený na akci zdarma!</strong>'
                : '<strong>Jsi přihlášen!</strong> Potvrzení jsme ti poslali i e-mailem.');
              if (!isFreeEvent && data.ooo_id) {
                loadPaymentInfo(data.ooo_id, data.name || data.email || '', typUcastiG, event.jednorazova === 'ano' ? 'final' : 'deposit', 'ooo_id');
              }
            })
            .catch(err => {
              console.error('Registrace (Google) error:', err);
              alert('Chyba při registraci: ' + err.message);
              submitBtn.disabled = false;
              updateGoogleSubmitState();
            });
        });
      }

      const discordForm = document.getElementById('registration-form');
      if (discordForm) discordForm.addEventListener('submit', function (e) {
        e.preventDefault();
        const typUcasti = document.querySelector('input[name="typUcasti"]:checked').value;
        const partner = partnerInput.value.trim();
        const selectedPrefs = Array.from(document.querySelectorAll('input[name="pref"]:checked')).map(cb => cb.value);
        const user = getLoggedUser();

        let depositAmount = event.zaloha || '0';
        let doplatekAmount = '';
        if (event.jednorazova === 'ano' && event.cena) {
          const cenaNum = parseFloat(event.cena.replace(/[^\d.,]/g, '').replace(',', '.')) || 0;
          doplatekAmount = (cenaNum * (typUcasti === 'par' ? 2 : 1)).toFixed(0);
          depositAmount = '0';
        }

        const qp = new URLSearchParams({
          event_id: event.event_id, typ_ucasti: typUcasti,
          user_discord: user?.userName || 'NEPRIHLASENY_USER',
          partner_discord: partner || '', user_id: user?.userId || '',
          preference: JSON.stringify(selectedPrefs),
          deposit_amount: depositAmount, doplatek_amount: doplatekAmount,
          jednorazova: event.jednorazova || 'ne'
        });

        fetch(API_BASE + '/api/register-event?' + qp.toString())
          .then(r => r.json().then(data => ({ status: r.status, data })))
          .then(({ status, data }) => {
            // Scénář 9e/3,6 (2026-08-24): dřív se tahle hláška zobrazila vždycky, i když
            // backend registraci odmítl (chybějící role - viz register-event/index.js) -
            // tichý "úspěch" navzdory selhání. Teď se odpověď skutečně rozliší, stejně
            // jako u sjednoceného Google formuláře výš.
            if (status !== 200 || data.ok === false) {
              alert('Chyba při registraci: ' + (data.error || 'neznámá chyba'));
              return;
            }
            document.getElementById('registration-block').classList.add('hidden');
            showPanel('registration-info', isFreeEvent
              ? '<strong>🎉 Jsi přihlášený na akci zdarma!</strong>'
              : '<strong>Jsi přihlášen!</strong> Tvá přihláška byla úspěšně zaregistrována.');

            if (user?.userId && event.discord_role_zajemce) {
              fetch(API_BASE + '/api/members-register?' +
                `user_id=${encodeURIComponent(user.userId)}&role_header=${encodeURIComponent(event.discord_role_zajemce)}`)
                .catch(err => console.error('members-register error:', err));
            }

            if (user?.userId && !isFreeEvent) {
              if (event.jednorazova === 'ano') {
                loadPaymentInfo(user.userId, user.userName, typUcasti, 'final');
              } else {
                loadPaymentInfo(user.userId, user.userName, typUcasti, 'deposit');
              }
            }
          })
          .catch(err => {
            console.error('Registrace error:', err);
            alert('Chyba při registraci: ' + err.message);
          });
      });
    }
  </script>
</body>
</html>
